<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Admin — SmartHydration</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0d9488,#059669);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#0f172a}.card{background:white;border-radius:20px;padding:32px 24px;max-width:420px;width:100%;box-shadow:0 20px 60px #0002;text-align:center}.logo{font-size:44px}h1{color:#0d9488;font-size:25px;margin:8px 0}p{color:#64748b;font-size:14px;line-height:1.6}.allowed{background:#f0fdfa;border-radius:10px;padding:12px;margin:18px 0;color:#0f766e;font-size:13px;overflow-wrap:anywhere}.msg{font-size:13px;margin-top:14px;white-space:pre-wrap}.error{color:#b91c1c}.hint{font-size:12px;color:#64748b;margin-top:18px}</style></head><body><main class="card"><div class="logo">💧</div><h1>SmartHydration</h1><p>Login khusus administrator untuk memantau konsumsi air siswa.</p><div class="allowed">Akun admin yang diizinkan<br><strong>smarthydration26@gmail.com</strong></div><div id="google-button" style="display:flex;justify-content:center;min-height:44px"></div><div id="message" class="msg" role="status"></div><div class="hint">Siswa tidak perlu login. Kembali ke <a href="siswa.html">halaman siswa</a>.</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyRWsYyXld42091APfDRe879PxbMn80vJ00kP2C3Qk75x2a6PdbV4ynRBr_WtR0Lb6_XA/exec';
// Ganti dengan OAuth Client ID yang dibuat di Google Cloud Console.
const GOOGLE_CLIENT_ID='3046488544-ce8koh808kjk91end518qabsifhr1f7n.apps.googleusercontent.com';
const ADMIN_EMAIL='smarthydration26@gmail.com';
function msg(text,error=false){const el=document.getElementById('message');el.textContent=text;el.className='msg'+(error?' error':'')}
async function handleCredential(response){msg('Memverifikasi akun Google…');try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'adminCheck',id_token:response.credential})});const data=await r.json();if(!data.success)throw new Error(data.error||'Akses ditolak.');if(String(data.email).toLowerCase()!==ADMIN_EMAIL)throw new Error('Akun Google ini bukan admin yang diizinkan.');sessionStorage.setItem('sh_id_token',response.credential);sessionStorage.setItem('sh_admin_email',data.email);msg('Login berhasil. Membuka dashboard…');location.href='admin.html'}catch(e){sessionStorage.removeItem('sh_id_token');msg(e.message||'Login gagal. Coba lagi.',true)}}
window.addEventListener('load',()=>{if(GOOGLE_CLIENT_ID.startsWith('GANTI_DENGAN_')){msg('Konfigurasi belum selesai: isi GOOGLE_CLIENT_ID pada login.html dan GOOGLE_OAUTH_CLIENT_ID pada Code.gs.',true);return}const wait=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.id){clearInterval(wait);google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredential,auto_select:false});google.accounts.id.renderButton(document.getElementById('google-button'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:280});} },150);setTimeout(()=>clearInterval(wait),10000)});
</script></body></html>
